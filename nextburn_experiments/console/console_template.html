<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextBurn Coverage Console</title>
<meta name="description" content="NextBurn: fire-safety test coverage for Moon and Mars habitats. Evidence ledger, coverage map, a boundary model that declines to guess, ranked next tests and frozen FM2 predictions.">
<style>
:root{--bg:#f4f5f7;--surface:#ffffff;--text:#1a1d23;--muted:#5a6372;--border:#d8dde4;--accent:#b93d0b;--accent-soft:#fff1e8;--link:#1d4ed8;--ok:#237a37;--ok-soft:#e5f4e9;--warn:#8a5300;--warn-soft:#fff3d6;--bad:#b42323;--bad-soft:#fdeaea;--neutral-soft:#eceff3;--code:#eef1f5;--focus:#2563eb;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--surface:#171a21;--text:#e7e9ee;--muted:#9aa3b2;--border:#2b313c;--accent:#ff8a4c;--accent-soft:#2a1a10;--link:#8fb0ff;--ok:#6fd38a;--ok-soft:#13261a;--warn:#f3bd5c;--warn-soft:#2a2210;--bad:#ff8686;--bad-soft:#2c1515;--neutral-soft:#222833;--code:#1f242d;--focus:#8fb0ff;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--link)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
code{background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px 10px;z-index:10}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#f97316,#b91c1c);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
h1{font-size:1.25rem;margin:0}
.tag{margin:0;color:var(--muted);font-size:.9rem}
.mode{font-size:.85rem;padding:6px 10px;border-radius:999px;background:var(--neutral-soft);color:var(--text);max-width:520px}
.mode.live{background:var(--ok-soft);color:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
main:focus{outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.card h2{font-size:1.08rem;margin:0 0 8px}
.card h3{font-size:.98rem;margin:14px 0 6px}
.intro{color:var(--muted);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:#e8a317}.kpi.bad{border-left-color:var(--bad)}.kpi.accent{border-left-color:var(--accent)}
.kpi .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:1.35rem;font-weight:700;margin:2px 0;line-height:1.25}
.kpi .s{font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.neutral{background:var(--neutral-soft);color:var(--text)}
.tw{overflow-x:auto;margin:6px 0 4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
thead th{background:var(--neutral-soft);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--accent-soft)}
tr.open td{background:var(--accent-soft)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:4px 0 12px}
.ctl label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:3px}
.ctl label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--text)}
select,input[type=text],input[type=search],input[type=number],input[type=url]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-width:0}
input[type=number]{width:120px}
button.b{font:inherit;font-size:.88rem;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.lnk{border:0;background:none;color:var(--link);padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.covs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
figure{margin:0}
figcaption{font-size:.88rem;margin:0 0 6px}
svg{max-width:100%;height:auto;display:block}
svg text{fill:var(--text);font-family:inherit}
svg .ax{font-size:10px;fill:var(--muted)}
svg rect.cell{stroke:var(--surface);stroke-width:1;cursor:pointer}
svg rect.cell:hover,svg rect.cell.sel{stroke:var(--text);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;align-items:end;margin:6px 0 10px}
.sl{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.sl span{display:flex;justify-content:space-between;gap:8px}
.sl output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{background:var(--neutral-soft);border-radius:8px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.warnbox{background:var(--warn-soft);color:var(--text);border-left:4px solid #e8a317;border-radius:6px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.okbox{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:6px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.badbox{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:6px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.detail{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.exps{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.exp img{width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff;margin-top:8px}
.exp .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600}
.setgrp tr.chg td,.setgrp tr.chg th{background:var(--accent-soft)}
.setgrp tr.err td,.setgrp tr.err th{background:var(--bad-soft)}
.setgrp th{font-weight:500;width:42%}
.help{font-size:.8rem;color:var(--muted);font-weight:400}
.emsg{font-size:.8rem;color:var(--bad)}
.gfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.gfoot .msg{flex-basis:100%}
.pager{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.bar{height:14px;background:var(--neutral-soft);border-radius:4px;overflow:hidden;min-width:120px}
.bar span{display:block;height:100%;background:var(--accent)}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.82rem}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;font-size:.85rem}
@media (max-width:640px){.kpi .v{font-size:1.1rem}main{padding:12px 10px 30px}.card{padding:12px}}
@media print{.tabs,.ctl,.sliders,.gfoot,.mode{display:none}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">NB</div>
    <div>
      <h1>NextBurn Coverage Console</h1>
      <p class="tag" id="nb-tagline">From evidence gap to test plan</p>
    </div>
  </div>
  <div class="mode" id="nb-mode" role="status">Loading the results</div>
</header>
<nav class="tabs" role="tablist" aria-label="Console sections" id="nb-tabs">
  <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
  <button type="button" role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
  <button type="button" role="tab" data-tab="boundary" aria-selected="false">Boundary model</button>
  <button type="button" role="tab" data-tab="plan" aria-selected="false">Next tests</button>
  <button type="button" role="tab" data-tab="fm2" aria-selected="false">FM2 predictions</button>
  <button type="button" role="tab" data-tab="ledger" aria-selected="false">Evidence ledger</button>
  <button type="button" role="tab" data-tab="experiments" aria-selected="false">Experiments</button>
  <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  <button type="button" role="tab" data-tab="runs" aria-selected="false">Runs</button>
  <button type="button" role="tab" data-tab="about" aria-selected="false">About</button>
</nav>
<main id="main" tabindex="-1"><div id="nb-view" role="tabpanel" aria-live="polite"><p class="muted">Loading. This page needs JavaScript.</p></div></main>
<footer class="foot" id="nb-foot">NextBurn is an independent NASA Space Apps Challenge 2026 entry. It is not produced, reviewed or endorsed by NASA.</footer>
<script type="application/json" id="nb-data">/*__NB_DATA__*/</script>
<script type="application/json" id="nb-images">/*__NB_IMAGES__*/</script>
<script id="nb-app">
"use strict";
var NBR = (function () {
  var FAM = { thin_fabric: "Thin fabrics", thick_plastic: "Thick plastics (PMMA)", other_textile: "Other textiles", unknown: "Material not stated" };
  var GRAV = { micro: "Microgravity", lunar: "Moon (0.16 g)", mars: "Mars (0.38 g)", earth: "Earth (1 g)", unknown: "Gravity not stated" };
  var COV_COL = { tested: "#2f9e44", nearby: "#f2a516", none: "#e03131" };
  var KPA_PER_PSI = 6.894757;

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function num(v) { if (v === null || v === undefined || v === "") return null; var x = Number(v); return isFinite(x) ? x : null; }
  function fx(v, d) { var x = num(v); return x === null ? "–" : x.toFixed(d === undefined ? 2 : d); }
  function pc(v, d) { var x = num(v); return x === null ? "–" : (x * 100).toFixed(d === undefined ? 1 : d) + "%"; }
  function pp(v, d) { var x = num(v); return x === null ? "–" : x.toFixed(d === undefined ? 1 : d) + "%"; }
  function famName(k) { return FAM[k] || k || "–"; }
  function gName(k) { return GRAV[k] || k || "–"; }
  function dirName(d) { d = Number(d); return d > 0 ? "upward" : d < 0 ? "downward" : "either direction"; }
  function gClassOf(g) { var x = num(g); if (x === null) return "unknown"; if (x < 0.05) return "micro"; if (x < 0.27) return "lunar"; if (x < 0.7) return "mars"; return "earth"; }
  function when(s) { return s ? String(s).replace("T", " ").replace("+00:00", " UTC").replace(/Z$/, " UTC") : "–"; }
  function statusClass(s) {
    s = String(s === undefined || s === null ? "" : s).toLowerCase();
    if (/not satisfactory|fail|declin|contradict|^none$|changed/.test(s)) return "bad";
    if (/with gaps|partial|pending|simulation|reported|nearby|^not done/.test(s)) return "warn";
    if (/^pass|^done|^ok|^sustains|^true|^tested|unchanged|^yes/.test(s)) return "ok";
    return "neutral";
  }
  function badge(s, cls) { return '<span class="badge ' + (cls || statusClass(s)) + '">' + esc(s) + "</span>"; }
  function N(v) { return { v: v, c: "num" }; }
  function td(c) { return (c && typeof c === "object") ? '<td class="' + esc(c.c || "") + '">' + c.v + "</td>" : "<td>" + (c === undefined || c === null ? "" : c) + "</td>"; }
  function table(head, rows, extra) {
    var h = '<div class="tw"><table' + (extra ? " " + extra : "") + "><thead><tr>" + head.map(function (x) {
      return (x && typeof x === "object") ? '<th scope="col" class="' + esc(x.c) + '">' + x.v + "</th>" : '<th scope="col">' + x + "</th>";
    }).join("") + "</tr></thead><tbody>";
    h += rows.map(function (r) { return "<tr>" + r.map(td).join("") + "</tr>"; }).join("");
    return h + "</tbody></table></div>";
  }
  function kpi(label, value, sub, cls) { return '<div class="kpi ' + (cls || "") + '"><div class="l">' + esc(label) + '</div><div class="v">' + value + '</div><div class="s">' + (sub || "") + "</div></div>"; }
  function sec(title, body, intro, id) { return '<section class="card"' + (id ? ' id="' + esc(id) + '"' : "") + "><h2>" + esc(title) + "</h2>" + (intro ? '<p class="intro">' + intro + "</p>" : "") + body + "</section>"; }
  function kv(pairs) { return '<dl class="kv">' + pairs.map(function (p) { return "<dt>" + esc(p[0]) + "</dt><dd>" + p[1] + "</dd>"; }).join("") + "</dl>"; }
  function ids(text) {
    return esc(text).replace(/\b(TP\d{3}|PSI-\d+_[A-Za-z0-9.]+)\b/g, function (m) { return '<button type="button" class="lnk" data-action="ledger-find" data-q="' + m + '">' + m + "</button>"; });
  }
  function fileLink(ctx, path, label) {
    var href = ctx && ctx.link ? ctx.link(path) : path;
    if (!href) return esc(label || path);
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label || path) + "</a>";
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

  // ------------------------------------------------------------------ settings paths (same syntax as console_lib.py)
  function splitPath(path) {
    var parts = [], buf = "", depth = 0;
    for (var i = 0; i < path.length; i++) {
      var ch = path[i];
      if (ch === "[") depth++;
      if (ch === "]") depth--;
      if (ch === "." && depth === 0) { parts.push(buf); buf = ""; } else buf += ch;
    }
    parts.push(buf);
    return parts;
  }
  var SEG = /^([A-Za-z_]\w*)(?:\[(?:(\w+)=([\w\-.]+)|(\d+))\])?$/;
  function stepInto(node, seg) {
    var m = SEG.exec(seg);
    if (!m) throw new Error("bad path segment " + seg);
    if (!node || typeof node !== "object" || !(m[1] in node)) throw new Error("no setting named " + m[1]);
    node = node[m[1]];
    if (m[2] !== undefined) {
      var hits = Array.isArray(node) ? node.filter(function (x) { return x && String(x[m[2]]) === m[3]; }) : [];
      if (hits.length !== 1) throw new Error(m[1] + "[" + m[2] + "=" + m[3] + "] matched " + hits.length + " items");
      node = hits[0];
    } else if (m[4] !== undefined) {
      if (!Array.isArray(node) || +m[4] >= node.length) throw new Error(m[1] + "[" + m[4] + "] is out of range");
      node = node[+m[4]];
    }
    return node;
  }
  function getPath(obj, path) { return splitPath(path).reduce(stepInto, obj); }
  function setPath(obj, path, value) {
    var parts = splitPath(path), node = obj;
    for (var i = 0; i < parts.length - 1; i++) node = stepInto(node, parts[i]);
    var m = SEG.exec(parts[parts.length - 1]);
    if (!m || m[2] !== undefined) throw new Error("a setting path must end on a value");
    if (m[4] !== undefined) node[m[1]][+m[4]] = value; else node[m[1]] = value;
    return obj;
  }
  function coerce(f, raw) {
    var t = f.type || "number", v;
    if (t === "bool") {
      if (raw === true || raw === false) v = raw;
      else if (/^(true|1|yes)$/i.test(String(raw))) v = true;
      else if (/^(false|0|no)$/i.test(String(raw))) v = false;
      else return { ok: false, msg: "choose yes or no" };
      return { ok: true, value: v };
    }
    if (String(raw).trim() === "") return { ok: false, msg: "a value is needed" };
    v = Number(raw);
    if (!isFinite(v)) return { ok: false, msg: "not a number" };
    if (t === "int" && Math.floor(v) !== v) return { ok: false, msg: "a whole number is needed" };
    if (f.min !== undefined && v < f.min) return { ok: false, msg: "below the minimum " + f.min };
    if (f.max !== undefined && v > f.max) return { ok: false, msg: "above the maximum " + f.max };
    return { ok: true, value: v };
  }
  function sameVal(a, b) { if (typeof a === "boolean" || typeof b === "boolean") return a === b; return Number(a) === Number(b); }
  function fileChanges(d, edits, file) {
    var out = { changes: [], errors: [] };
    d.settings.schema.groups.forEach(function (g) {
      if (g.file !== file) return;
      g.fields.forEach(function (f) {
        var key = g.file + "|" + f.path;
        if (!Object.prototype.hasOwnProperty.call(edits, key)) return;
        var r = coerce(f, edits[key]), cur = d.settings.values[key];
        if (!r.ok) out.errors.push({ path: f.path, label: f.label, msg: r.msg });
        else if (!sameVal(r.value, cur)) out.changes.push({ path: f.path, label: f.label, old: cur, value: r.value, group: g.id });
      });
    });
    return out;
  }
  function updatedFile(d, file, changes) {
    var obj = JSON.parse(JSON.stringify(d.settings.files[file]));
    changes.forEach(function (c) { setPath(obj, c.path, c.value); });
    return obj;
  }
  function changeRequest(d, file, changes, when_) {
    return { nextburn_settings_change: 1, file: file, created_utc: when_ || null, made_with: "NextBurn Coverage Console", changes: changes.map(function (c) { return { path: c.path, old: c.old, "new": c.value }; }) };
  }
  function issueBody(req) {
    var lines = ["Proposed settings change for `" + req.file + "`, made in the NextBurn Coverage Console.", "", "| Setting | Now | Proposed |", "|---|---|---|"];
    req.changes.forEach(function (c) { lines.push("| `" + c.path + "` | " + c.old + " | " + c["new"] + " |"); });
    lines.push("", "Apply it with `python console/apply_settings.py change.json`, where change.json holds the block below, then rerun the experiments listed in the Runs tab.", "", "```json", JSON.stringify(req, null, 2), "```");
    return lines.join("\n");
  }

  // ------------------------------------------------------------------ boundary what-if
  function declinedAt(P, j, i, t) {
    return P.support_distance[j][i] > t.support || P.ci90_width[j][i] > t.width || P.contra_distance[j][i] <= t.conflict;
  }
  function defaultThr(d) { var dc = (d.grid && d.grid.decline) || {}; return { support: num(dc.support_max_distance) || 1, width: num(dc.ci90_max_width) || 0.6, conflict: num(dc.conflict_radius) || 0 }; }
  function panelShares(d, t) {
    var G = d.grid, out = [], all = 0, allN = 0, model = 0, diff = 0;
    (G.panels || []).forEach(function (P) {
      var n = 0, dec = 0, m = 0;
      for (var j = 0; j < P.p_mean.length; j++) for (var i = 0; i < P.p_mean[j].length; i++) {
        n++; var w = declinedAt(P, j, i, t); if (w) dec++; if (P.declined[j][i]) m++; if (w !== !!P.declined[j][i]) diff++;
      }
      out.push({ label: P.label, g_class: P.g_class, direction: P.direction, n: n, whatif: dec / n, model: m / n });
      all += dec; allN += n; model += m;
    });
    return { panels: out, whatif: allN ? all / allN : 0, model: allN ? model / allN : 0, cells: allN, diff: diff };
  }
  function probColor(p) {
    var stops = [[0, [33, 102, 172]], [0.25, [103, 169, 207]], [0.5, [247, 247, 247]], [0.75, [239, 138, 98]], [1, [178, 24, 43]]];
    p = Math.max(0, Math.min(1, p));
    for (var k = 1; k < stops.length; k++) if (p <= stops[k][0]) {
      var a = stops[k - 1], b = stops[k], u = (p - a[0]) / (b[0] - a[0]);
      return "rgb(" + [0, 1, 2].map(function (c) { return Math.round(a[1][c] + u * (b[1][c] - a[1][c])); }).join(",") + ")";
    }
    return "rgb(178,24,43)";
  }
